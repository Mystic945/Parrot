[package]
name = "parrot"
version = "0.1.0"
description = "Offline push-to-talk speech to text"
edition = "2021"
rust-version = "1.77"

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
# Pinned to 0.15: the 0.16+ line reworked the device/stream API.
cpal = "0.15"
hound = "3"
whisper-rs = "0.16"
enigo = "0.6"
arboard = "3"
# Blocking HTTP with rustls: no OpenSSL, no async runtime to clash with Tauri's.
ureq = "3"

[profile.dev]
# whisper.cpp is unusably slow when its dependencies are unoptimized.
opt-level = 1
# Incremental compilation plus any optimization trips a rustc/LLVM bug on
# Windows MSVC: anonymous symbols get internalized in one codegen unit and are
# then unresolvable from another, so the link dies with a wall of
# "unresolved external symbol anon.<hash>.llvm.<n>". Release was never affected
# because it does not use incremental. Costs a few seconds per rebuild.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
